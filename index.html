<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Lazy Loading</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f2f2f2;
        }

        header {
            background-color: #1e3a8a;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .banner {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }

        h2 {
            text-align: center;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .gallery img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 10px;
        }

        footer {
            text-align: center;
            padding: 20px;
            background-color: #1e3a8a;
            color: white;
        }
    </style>
</head>

<body>

    <header>
        <h1>Image Gallery</h1>
        <p>Understanding Lazy Loading in HTML</p>
    </header>

    <img
        class="banner"
        src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1200"
        alt="Beautiful landscape banner"
    >

    <h2>Explore Our Gallery</h2>

    <div class="gallery">

        <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=600" alt="Mountain landscape" loading="lazy">
